name: Windows preview installer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Prepare icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python tools/prepare_assets.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax test
        run: |
          node --check main.js
          node --check preload.js
      - name: Build NSIS
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win
      - name: Upload EXE
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Chuke-Windows-Preview-Installer
          path: dist/*Setup.exe
          if-no-files-found: error
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag='windows-preview-0.28.1'
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag dist/*Setup.exe --title '初刻 Windows 0.28.1 测试预览' --notes '仅 UI 交互预览和本机演示数据。真实登录、云端同步、直播功能未验收；当前安装包未签名。' --prerelease
          } else {
            gh release upload $tag dist/*Setup.exe --clobber
          }
