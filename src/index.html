.voice-chip{display:flex!important;align-items:center;gap:8px;min-width:138px;padding:6px 9px!important;border-radius:13px!important;background:rgba(255,255,255,.55)!important}
.voice-play-icon{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#dff6f2;color:#148b8d;font-size:11px}
.voice-wave{display:flex;align-items:center;gap:2px;height:22px;flex:1}.voice-wave i{display:block;width:2px;border-radius:99px;background:#5fbfbb}.voice-wave i:nth-child(1){height:6px}.voice-wave i:nth-child(2){height:12px}.voice-wave i:nth-child(3){height:18px}.voice-wave i:nth-child(4){height:9px}.voice-wave i:nth-child(5){height:15px}.voice-wave i:nth-child(6){height:7px}.voice-chip.playing .voice-play-icon{background:#25aaa7;color:#fff}.voice-chip small{font-size:9px;color:#75898b}
.video-message-card{width:min(330px,100%);padding:0;background:#153a3d;border-radius:15px;overflow:hidden;cursor:pointer;position:relative;text-align:left;box-shadow:0 8px 20px rgba(16,54,57,.12)}
.video-message-card video,.video-message-card .video-fallback{display:block;width:100%;height:185px;object-fit:cover;background:linear-gradient(145deg,#244e51,#7eb6b2)}
.video-message-card .video-fallback{display:grid;place-items:center;color:rgba(255,255,255,.8);font-size:12px}
.video-message-card .video-play-overlay{position:absolute;left:50%;top:50%;transform:translate(-50%,-58%);width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.9);color:#178b8d;font-size:18px;box-shadow:0 8px 24px rgba(0,0,0,.16)}
.video-message-card .video-meta{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;color:#e6f6f5;font-size:9px}
.media-confirm-card{margin-top:12px;border:1px solid var(--line);border-radius:16px;padding:12px;background:#f8fbfa}.media-confirm-card .send-preview{margin:0 auto;max-height:360px}.media-confirm-meta{display:flex;justify-content:space-between;gap:14px;margin-top:10px;color:#738789;font-size:10px}.media-confirm-target{display:flex;align-items:center;gap:9px;padding:10px 12px;background:#eef8f6;border-radius:12px;margin-top:10px;font-size:11px}.media-confirm-target b{font-size:12px}
.media-detail-modal video,.media-detail-modal img{max-width:100%;max-height:62vh;border-radius:16px;display:block;margin:0 auto;background:#102f31}.media-detail-meta{display:flex;justify-content:space-between;gap:16px;padding:12px 2px 0;color:#748789;font-size:10px}
.recording-dock{position:fixed;z-index:70;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;background:rgba(255,255,255,.96);border:1px solid #d7e8e6;box-shadow:0 18px 48px rgba(18,69,71,.18);backdrop-filter:blur(18px)}
.recording-dot{width:10px;height:10px;border-radius:50%;background:#ff5959;box-shadow:0 0 0 0 rgba(255,89,89,.45);animation:recPulse 1.2s infinite}.recording-copy{display:flex;flex-direction:column;min-width:130px}.recording-copy b{font-size:11px}.recording-copy small{font-size:9px;color:#829497;margin-top:2px}.recording-time{font-variant-numeric:tabular-nums;font-size:12px;font-weight:700;color:#294b4d}.recording-dock button{height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer}.recording-dock .finish{border-color:#25aaa7;background:#25aaa7;color:#fff}@keyframes recPulse{70%{box-shadow:0 0 0 8px rgba(255,89,89,0)}100%{box-shadow:0 0 0 0 rgba(255,89,89,0)}}
.voice-preview{padding:12px;border:1px solid var(--line);border-radius:14px;background:#f8fbfa}.voice-preview audio{width:100%;margin-top:8px}
.file-detail-icon{width:58px;height:58px;border-radius:16px;background:#e7f7f4;color:#178c8d;display:grid;place-items:center;font-size:26px;margin-bottom:12px}.file-detail-name{font-size:15px;font-weight:700;word-break:break-all}.file-detail-sub{color:#7d8f91;font-size:10px;margin-top:5px}
@media(max-width:980px){.composer{gap:5px;padding-left:10px;padding-right:10px}.composer button{width:36px;height:36px}.video-message-card,.media-image-button img{max-width:270px}}


/* V27 module layout fix: non-chat pages occupy all available desktop width */
.workspace.module-mode{grid-template-columns:152px minmax(0,1fr)!important;}
.workspace.module-mode .main{grid-column:2;min-width:0;width:100%;}
.workspace.module-mode .module{width:100%;max-width:none;padding:24px 28px 30px;}
.workspace.module-mode #moduleBody{width:100%;min-width:0;}
.workspace.module-mode .v25-grid{width:100%;max-width:none;min-width:0;}
.workspace.module-mode .v25-grid>*{min-width:0;}
@media(max-width:1200px){.workspace.module-mode{grid-template-columns:132px minmax(0,1fr)!important}.workspace.module-mode .module{padding:22px 20px 28px}.v25-friends,.v25-moments,.v25-anniv,.v25-album,.v25-daily{grid-template-columns:minmax(0,1.08fr) minmax(360px,.92fr)}.v25-groups{grid-template-columns:minmax(220px,.8fr) minmax(360px,1.25fr) minmax(250px,.9fr)}}
@media(max-width:980px){.workspace.module-mode{grid-template-columns:80px minmax(0,1fr)!important}.workspace.module-mode .module{padding:18px 14px 24px}.v25-friends,.v25-moments,.v25-anniv,.v25-album,.v25-daily,.v25-groups{grid-template-columns:1fr}.v25-moment-detail,.v25-anniv-detail,.v25-album-detail,.v25-daily-side,.v25-profile-card,.v25-group-side{min-height:auto}.v25-album-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.v25-today-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

function timeLabelToTodayMs(label,index=0){
  const now=new Date();
  const match=String(label||'').match(/^(\d{1,2}):(\d{2})$/);
  if(match){const d=new Date(now);d.setHours(Number(match[1]),Number(match[2]),0,0);return d.getTime();}
  if(String(label).includes('昨天')) return now.getTime()-86400000-index;
  if(String(label).includes('周')) return now.getTime()-2*86400000-index;
  return now.getTime()-index*1000;
}
function messagePreview(m){
  if(!m)return '';
  if(m.recalled)return m.me?'你撤回了一条消息':'对方撤回了一条消息';
  if(m.forwardMeta)return `[转发] ${messageSummary(m)}`;
  if(m.type==='image')return `${m.me?'你：':''}[图片]`;
  if(m.type==='file')return `${m.me?'你：':''}[文件] ${m.name||''}`.trim();
  if(m.type==='voice')return `${m.me?'你：':''}[语音]`;
  const text=String(m.text||'').replace(/\s+/g,' ').trim();
  return `${m.me?'你：':''}${text}`.slice(0,40);
}

  if(activeConversationContextMenu){activeConversationContextMenu.remove();activeConversationContextMenu=null;}
}
function openConversationContextMenu(id,x,y){
  closeConversationContextMenu(); closeMessageContextMenu();
  const c=conversations.find(v=>v.id===id); if(!c)return;
  const unread=conversationUnread(c);
  const menu=document.createElement('div'); menu.className='conversation-context-menu'; menu.setAttribute('role','menu');
  menu.innerHTML=`<button type="button" data-convctx="read"><span>${unread?'标为已读':'标为未读'}</span><small>${unread?'✓':'●'}</small></button><button type="button" data-convctx="pin"><span>${state.pinned[id]?'取消置顶':'置顶聊天'}</span><small>⌖</small></button><button type="button" data-convctx="mute"><span>${state.muted[id]?'取消消息免打扰':'消息免打扰'}</span><small>◌</small></button><div class="ctx-sep"></div><button type="button" data-convctx="open"><span>打开聊天</span><small>›</small></button>`;
  document.body.appendChild(menu); activeConversationContextMenu=menu;
  const pad=8,rect=menu.getBoundingClientRect(); menu.style.left=`${Math.min(Math.max(pad,x),window.innerWidth-rect.width-pad)}px`; menu.style.top=`${Math.min(Math.max(pad,y),window.innerHeight-rect.height-pad)}px`;
  menu.querySelectorAll('[data-convctx]').forEach(btn=>btn.onclick=e=>{
    e.stopPropagation(); const action=btn.dataset.convctx; closeConversationContextMenu();
    if(action==='read'){unread?markConversationRead(id):markConversationUnread(id);renderList();toast(unread?'已标为已读':'已标为未读');}
    if(action==='pin'){state.pinned[id]=!state.pinned[id];saveState();renderList();toast(state.pinned[id]?'已置顶聊天':'已取消置顶');}
    if(action==='mute'){state.muted[id]=!state.muted[id];saveState();renderList();toast(state.muted[id]?'已开启消息免打扰':'已取消消息免打扰');}
    if(action==='open'){state.active=id;markConversationRead(id);state.detailOpen=false;saveState();renderList();renderChat();}
  });
  conversationContextOutsideHandler=event=>{if(activeConversationContextMenu&&!activeConversationContextMenu.contains(event.target))closeConversationContextMenu()};
  setTimeout(()=>document.addEventListener('pointerdown',conversationContextOutsideHandler),0);
}
let activeMessageContextMenu=null;
let messageContextOutsideHandler=null;
function closeMessageContextMenu(){
  if(messageContextOutsideHandler){document.removeEventListener('pointerdown',messageContextOutsideHandler);messageContextOutsideHandler=null;}
  if(activeMessageContextMenu){activeMessageContextMenu.remove();activeMessageContextMenu=null;}
}
function messageSummary(m){
  if(m.type==='image') return '图片';
  if(m.type==='file') return m.name||'文件';
  if(m.type==='voice') return '语音消息';
  return (m.text||'消息').replace(/\s+/g,' ').slice(0,42);
}
function startQuote(m){
  replyTarget=messageSummary(m);
  const bar=$('#replyBar');
  if(bar){
    bar.hidden=false;
    bar.innerHTML=`<span>引用：${replyTarget}</span><button id="cancelReply" aria-label="取消引用">×</button>`;
    $('#cancelReply').onclick=()=>{replyTarget=null;bar.hidden=true};
  }
  $('#messageInput')?.focus();
}
function confirmRecallMessage(m){
  openModal(`<h2>撤回消息</h2><p class="muted">确定要撤回这条消息吗？撤回后聊天中会显示“你撤回了一条消息”。</p><div class="modal-actions"><button class="secondary-card-btn" id="cancelRecall">取消</button><button class="danger-btn" id="confirmRecall">确认撤回</button></div>`);
  $('#cancelRecall').onclick=closeModal;
  $('#confirmRecall').onclick=()=>{
    m.type='text';m.text='你撤回了一条消息';m.recalled=true;
    saveMessages();closeModal();renderChat();toast('消息已撤回');
  };
}
function deleteMessage(m){
  const data=msgs[state.active]||[];
  const idx=data.indexOf(m);
  if(idx>=0){data.splice(idx,1);saveMessages();renderChat();toast('消息已删除');}
}
function openMessageContextMenu(m,x,y){
  closeMessageContextMenu();
  const menu=document.createElement('div');
  menu.className='message-context-menu';
  menu.setAttribute('role','menu');
  menu.innerHTML=`<button type="button" data-ctx="quote"><span>引用</span><small>↩</small></button><button type="button" data-ctx="forward"><span>转发</span><small>↗</small></button>${m.me?'<div class="ctx-sep"></div><button type="button" data-ctx="recall"><span>撤回</span><small>⌫</small></button>':''}<button type="button" class="danger" data-ctx="delete"><span>删除</span><small>×</small></button>`;
  document.body.appendChild(menu);
  activeMessageContextMenu=menu;
  const pad=8,rect=menu.getBoundingClientRect();
  menu.style.left=`${Math.min(Math.max(pad,x),window.innerWidth-rect.width-pad)}px`;
  menu.style.top=`${Math.min(Math.max(pad,y),window.innerHeight-rect.height-pad)}px`;
  menu.querySelectorAll('[data-ctx]').forEach(btn=>btn.onclick=e=>{
    e.stopPropagation();
    const action=btn.dataset.ctx;
    closeMessageContextMenu();
    if(action==='quote')startQuote(m);
    if(action==='forward')openForwardModal(m);
    if(action==='recall')confirmRecallMessage(m);
    if(action==='delete')deleteMessage(m);
  });
  messageContextOutsideHandler=(event)=>{
    if(activeMessageContextMenu && !activeMessageContextMenu.contains(event.target)) closeMessageContextMenu();
  };
  setTimeout(()=>document.addEventListener('pointerdown',messageContextOutsideHandler),0);
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMessageContextMenu();closeConversationContextMenu()}});

let replyTarget=null;
function sendMessage(){
  const i=$('#messageInput');const t=i.value.trim();if(!t)return;if(!msgs[state.active])msgs[state.active]=[];
  msgs[state.active].push({id:uid('msg'),me:true,type:'text',text:t,time:nowTime(),read:false,replyTo:replyTarget});

function openForwardModal(m){
  const sourceConv=getConv();
  const inherited=m.forwardMeta||null;
  const sourceMeta=inherited||{
    sourceName:sourceConv.name,
    sourceType:sourceConv.type,
    sourceSender:m.me?'我':(m.sender||sourceConv.name)
  };
  const sourceLabel=sourceMeta.sourceType==='group'?`群聊 ${sourceMeta.sourceName}${sourceMeta.sourceSender&&sourceMeta.sourceSender!=='我'?` · ${sourceMeta.sourceSender}`:''}`:sourceMeta.sourceName;
  const summary=messageSummary(m);
  openModal(`<h2>选择转发对象</h2><p class="muted">选择好友或群聊后，会进入确认页面，你可以在确认时添加一段附言。</p><div class="forward-preview"><div class="forward-preview-head"><b>转发</b><small>来自 ${sourceLabel}</small></div><div class="forward-preview-body">${escapeHtml(summary)}</div></div><div class="pick-list">${conversations.filter(c=>c.id!==state.active).map(c=>`<button class="pick-row" data-forward="${c.id}"><span class="${avatarClass(c)}">${c.avatar}</span><span class="pick-meta"><b>${c.name}</b><small>${c.type==='group'?`${c.members?.length||0} 位成员 · 群聊`:'好友'}</small></span><span class="pick-arrow">›</span></button>`).join('')}</div>`);
  $$('[data-forward]').forEach(x=>x.onclick=()=>{
    const target=conversations.find(c=>c.id===x.dataset.forward);
    if(target)openForwardConfirm(m,target,sourceMeta,sourceLabel,summary);
  });
}
function openForwardConfirm(m,target,sourceMeta,sourceLabel,summary){
  openModal(`<h2>确认转发</h2><p class="muted">确认转发给下面的好友或群聊。你可以添加一段附言，附言会显示在原消息下方。</p><div class="forward-confirm-target"><span class="${avatarClass(target)}">${target.avatar}</span><span class="pick-meta"><b>${target.name}</b><small>${target.type==='group'?`${target.members?.length||0} 位成员 · 群聊`:'好友'}</small></span></div><div class="forward-preview"><div class="forward-preview-head"><b>转发</b><small>来自 ${sourceLabel}</small></div><div class="forward-preview-body">${escapeHtml(summary)}</div></div><div class="forward-comment-field"><label><span>添加附言</span><small id="forwardCommentCount">0 / 120</small></label><textarea id="forwardCommentInput" class="forward-comment-input" maxlength="120" placeholder="可以给对方留一句附言（可选）"></textarea><p class="forward-confirm-note">附言会显示在原消息下方，与转发内容清楚区分。</p></div><div class="modal-actions"><button class="secondary-card-btn" id="cancelForward">取消</button><button class="primary-card-btn" id="confirmForward">确认转发</button></div>`);
  const input=$('#forwardCommentInput');
  const count=$('#forwardCommentCount');
  input.oninput=()=>count.textContent=`${input.value.length} / 120`;
  input.focus();
  $('#cancelForward').onclick=closeModal;
  $('#confirmForward').onclick=()=>{
    const comment=input.value.trim();
    if(!msgs[target.id])msgs[target.id]=[];
    const forwarded={...m,id:uid('fwd'),me:true,time:nowTime(),read:false,recalled:false,forwardMeta:{...sourceMeta},forwardComment:comment};
    msgs[target.id].push(forwarded);
    const forwardPreview=`[转发] ${summary}${comment?` · 附言：${comment}`:''}`.slice(0,40);
    saveMessages();touchConversation(target.id,forwardPreview);renderList();closeModal();toast(`已转发给 ${target.name}${comment?'，附言已添加':''}`);
  };
}

let mediaRecorder=null,recordChunks=[],recordStarted=0;
async function toggleRecorder(){
  if(mediaRecorder&&mediaRecorder.state==='recording'){mediaRecorder.stop();return}
  if(!navigator.mediaDevices?.getUserMedia){toast('当前预览环境不支持录音，Windows 客户端中会启用');return}

}

function deliveryLabel(m){

  if(m.delivery==='sending') return '<span class="delivery-state sending">发送中…</span>';
  if(m.delivery==='failed') return `<span class="delivery-state failed" data-retry="${m.id}" title="点击重新发送">发送失败 · 重试</span>`;
  return '<span class="delivery-state">已发送</span>';
}
function messageHtml(m){

  else if(m.type==='file') body=`<div class="file-card"><span>▤</span><div><b>${escapeHtml(m.name)}</b><small>${escapeHtml(m.size||'文件')}</small></div></div>`;
  else if(m.type==='voice') body=`<button class="voice-chip" data-voice="${m.id}">▶ <span>${escapeHtml(m.duration||'00:08')}</span></button>`;
  else body=escapeHtml(m.text||'').replace(/\n/g,'<br>');
  if(m.recalled){return `<div class="msg-row me recalled-row" data-msg="${m.id}"><div class="bubble recalled-bubble"><span>你撤回了一条消息</span><div class="message-meta"><time>${escapeHtml(m.time)}</time></div></div></div>`;}
  const forwarded=m.forwardMeta;
  const forwardLabel=forwarded?(forwarded.sourceType==='group'?`转发自群聊 ${escapeHtml(forwarded.sourceName)}${forwarded.sourceSender&&forwarded.sourceSender!=='我'?` · ${escapeHtml(forwarded.sourceSender)}`:''}`:`转发自 ${escapeHtml(forwarded.sourceName)}`):'';
  const quote=m.replyTo?`<div class="reply-quote">引用：${escapeHtml(m.replyTo)}</div>`:'';
  const content=forwarded?`<div class="forward-shell"><div class="forward-head"><span class="forward-badge">转发</span><span class="forward-source">${forwardLabel}</span></div><div class="forward-content">${quote}${body}</div>${m.forwardComment?`<div class="forward-comment"><span>附言</span><p>${escapeHtml(m.forwardComment)}</p></div>`:''}</div>`:`${quote}${body}`;
  return `<div class="msg-row ${m.me?'me':''}" data-msg="${m.id}">${!m.me&&m.sender?`<small class="sender-name">${escapeHtml(m.sender)}</small>`:''}<div class="bubble ${forwarded?'forwarded-bubble':''}">${content}<div class="message-meta"><time>${escapeHtml(m.time)}</time>${deliveryLabel(m)}</div></div></div>`;

let v22MediaDbPromise=null;
function openMediaDb(){
  if(v22MediaDbPromise)return v22MediaDbPromise;
  v22MediaDbPromise=new Promise((resolve,reject)=>{
    if(!window.indexedDB){reject(new Error('IndexedDB unavailable'));return;}
    const req=indexedDB.open('chuke-media-v22',1);
    req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('media'))db.createObjectStore('media');};
    req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('media db failed'));
  });

}
async function storeMediaBlob(blob){
  const key=`media-${Date.now()}-${Math.random().toString(36).slice(2,8)}`;
  const db=await openMediaDb();
  await new Promise((resolve,reject)=>{const tx=db.transaction('media','readwrite');tx.objectStore('media').put(blob,key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});

}

<script>
// V24 comprehensive detail / accessibility / desktop polish --------------------
(function(){
  let lastModalFocus=null;
  const originalOpenModal=window.openModal;
  const originalCloseModal=window.closeModal;
  const originalToast=window.toast;
  const originalRenderChat=window.renderChat;
  const originalRenderList=window.renderList;
  const originalMessageMenu=window.openMessageContextMenu;

  function firstFocusable(root){return root?.querySelector('input:not([disabled]),textarea:not([disabled]),button:not([disabled]),[tabindex]:not([tabindex="-1"])')}
  window.openModal=function(content){
    lastModalFocus=document.activeElement;
    originalOpenModal(content);
    const modal=$('#modal'),card=modal?.querySelector('.modal-card');
    if(modal){modal.setAttribute('role','dialog');modal.setAttribute('aria-modal','true')}
    if(card){card.setAttribute('tabindex','-1');setTimeout(()=>{const el=firstFocusable(card);(el||card).focus({preventScroll:true})},0)}
  };
  window.closeModal=function(){
    originalCloseModal();
    const back=lastModalFocus;lastModalFocus=null;
    if(back&&document.contains(back))setTimeout(()=>back.focus({preventScroll:true}),0);
  };
  $('#modal')?.addEventListener('pointerdown',e=>{if(e.target===$('#modal'))closeModal()});

  window.toast=function(text){
    const el=$('#toast');if(el){el.setAttribute('role','status');el.setAttribute('aria-live','polite');el.setAttribute('aria-atomic','true')}
    originalToast(text);
  };

  function enhanceIconButtons(){
    const actionNames={voice:'语音通话',video:'视频通话',more:'更多会话设置',emoji:'表情',image:'发送图片',file:'发送文件',record:'录制语音',videoMsg:'发送视频'};
    $$('[data-act]').forEach(b=>{const n=actionNames[b.dataset.act];if(n){b.setAttribute('aria-label',n);b.title=n}});
    const send=$('#sendBtn');if(send){send.setAttribute('aria-label','发送消息');send.title='发送消息'}
    const avatar=$('#chatAvatarBtn');if(avatar&&!avatar.title)avatar.title='查看资料';
    $$('.row-more').forEach(b=>{b.setAttribute('aria-label','更多操作');b.title='更多操作'});
    $$('.conversation').forEach(el=>{el.setAttribute('tabindex','0');el.setAttribute('role','button');el.setAttribute('aria-label',`打开会话：${el.querySelector('.body b')?.textContent?.trim()||'会话'}`);});
    $$('.msg-row:not(.recalled-row)').forEach(el=>{el.setAttribute('tabindex','0');el.setAttribute('aria-label','消息，按 Shift+F10 或鼠标右键查看更多操作')});
  }
  function refreshComposerState(){
    const input=$('#messageInput'),send=$('#sendBtn');if(!input||!send)return;
    const hasText=!!input.value.trim();send.disabled=!hasText;send.setAttribute('aria-disabled',String(!hasText));
  }
  function enhanceChat(){
    enhanceIconButtons();
    const input=$('#messageInput');if(input){input.setAttribute('aria-label','输入消息');input.setAttribute('maxlength','5000');input.addEventListener('input',refreshComposerState);refreshComposerState();}
    const composer=document.querySelector('.composer');if(composer&&!composer.querySelector('.composer-hint'))composer.insertAdjacentHTML('beforeend','<span class="composer-hint">Enter 发送 · Shift + Enter 换行</span>');
    const head=document.querySelector('.chat-head .person');if(head&&!navigator.onLine&&!head.querySelector('.network-pill'))head.insertAdjacentHTML('beforeend','<span class="network-pill">网络不可用</span>');
  }
  window.renderChat=function(){originalRenderChat();enhanceChat()};

  function enhanceListEmpty(){
    const list=$('#conversationList');if(!list)return;
    if(!list.querySelector('.conversation')){
      const q=$('#searchInput')?.value?.trim();
      list.innerHTML=`<div class="list-empty-state"><i>⌕</i><b>${q?'没有找到相关会话':'还没有会话'}</b><p>${q?'换一个关键词试试，或者直接新建会话。':'从添加好友或新建聊天开始。'}</p><button id="v24NewChat">＋ 新建会话</button></div>`;
      $('#v24NewChat').onclick=()=>typeof openNewFlow==='function'?openNewFlow():$('#newBtn')?.click();
    }
    enhanceIconButtons();
  }
  window.renderList=function(){originalRenderList();enhanceListEmpty()};

  // Message menu: keep existing actions, add Copy for text/reply/forwarded text.
  window.openMessageContextMenu=function(m,x,y){
    originalMessageMenu(m,x,y);
    const menu=document.querySelector('.message-context-menu');if(!menu)return;
    menu.setAttribute('aria-label','消息操作');
    const text=(m.text||m.forwardText||m.replyText||'').trim();
    if(text&&!menu.querySelector('[data-v24-copy]')){
      const b=document.createElement('button');b.type='button';b.className='v24-copy-action';b.dataset.v24Copy='1';b.innerHTML='<span>复制</span><small>⧉</small>';
      b.onclick=async e=>{e.stopPropagation();try{await navigator.clipboard.writeText(text);toast('已复制消息文字')}catch{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('已复制消息文字')}if(typeof closeMessageContextMenu==='function')closeMessageContextMenu();};
      const first=menu.querySelector('button');menu.insertBefore(b,first||null);
    }
    menu.querySelectorAll('button').forEach(btn=>{btn.setAttribute('role','menuitem');btn.setAttribute('tabindex','-1')});
    const first=menu.querySelector('button');if(first){first.tabIndex=0;setTimeout(()=>first.focus({preventScroll:true}),0)}
  };

  function activeMenu(){return document.querySelector('.message-context-menu,.conversation-context-menu,.content-menu,.floating-menu')}
  document.addEventListener('keydown',e=>{
    const modal=$('#modal');if(modal?.classList.contains('open')&&e.key==='Tab'){
      const card=modal.querySelector('.modal-card'),items=Array.from(card.querySelectorAll('button:not([disabled]),input:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')).filter(x=>x.offsetParent!==null);
      if(items.length){const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}
    }
    const menu=activeMenu();if(menu&&['ArrowDown','ArrowUp','Home','End'].includes(e.key)){
      const items=Array.from(menu.querySelectorAll('button:not([disabled])'));if(!items.length)return;e.preventDefault();let i=items.indexOf(document.activeElement);if(e.key==='Home')i=0;else if(e.key==='End')i=items.length-1;else if(e.key==='ArrowDown')i=(i+1+items.length)%items.length;else i=(i-1+items.length)%items.length;items.forEach(x=>x.tabIndex=-1);items[i].tabIndex=0;items[i].focus();
    }
    if(e.key==='F10'&&e.shiftKey&&state?.nav==='chat'){
      const row=document.activeElement?.closest?.('.msg-row');if(row){e.preventDefault();const m=(msgs[state.active]||[]).find(x=>x.id===row.dataset.msg);if(m&&!m.recalled){const r=row.getBoundingClientRect();openMessageContextMenu(m,r.left+Math.min(r.width*.55,260),r.top+Math.min(r.height,36))}}
    }
    if(e.key==='Enter'&&document.activeElement?.classList?.contains('conversation')){document.activeElement.click()}
  });

  // Generic dynamic UI enhancement for menus and newly-rendered sections.
  const observer=new MutationObserver(records=>{
    let needs=false;for(const r of records){if(r.addedNodes.length){needs=true;break}}if(!needs)return;
    document.querySelectorAll('.message-context-menu,.conversation-context-menu,.content-menu,.floating-menu').forEach(menu=>{menu.setAttribute('role','menu');menu.querySelectorAll('button').forEach(b=>{b.setAttribute('role','menuitem');if(!b.hasAttribute('tabindex'))b.tabIndex=-1})});
    enhanceIconButtons();
  });
  observer.observe(document.body,{childList:true,subtree:true});

  ['resize','blur'].forEach(evt=>window.addEventListener(evt,()=>{try{closeMessageContextMenu?.();closeConversationContextMenu?.();closeContentMenu?.()}catch{}}));
  document.addEventListener('scroll',e=>{if(e.target?.closest?.('.messages,.conversation-list,.module,.detail')){try{closeMessageContextMenu?.();closeConversationContextMenu?.();closeContentMenu?.()}catch{}}},true);

  // Empty states for shared content after user removes everything.
  function wrapEmpty(name,selector,title,copy,buttonLabel,action){
    const fn=window[name];if(typeof fn!=='function')return;window[name]=function(){fn();const host=document.querySelector(selector);if(host&&!host.children.length){host.innerHTML=`<div class="module-empty-state"><i>✦</i><b>${title}</b><p>${copy}</p><button type="button">${buttonLabel}</button></div>`;host.querySelector('button').onclick=action;}};
  }
  wrapEmpty('renderAlbum','.album-grid','共享相册还是空的','把第一张一起想留下的照片放进来。','＋ 添加照片',()=>$('#uploadAlbum')?.click());
  wrapEmpty('renderMoments','.moments-feed','还没有朋友圈动态','分享一句今天，或者留下一张照片。','＋ 发布动态',()=>$('#postMoment')?.click());
  wrapEmpty('renderAnniversaries','.anniv-list','还没有纪念日','把重要的日期和当时的一句话放在这里。','＋ 添加纪念日',()=>$('#addAnniversary')?.click());

  // Initial enhancement without changing current navigation state.
  enhanceIconButtons();if(state?.nav==='chat'){enhanceChat();enhanceListEmpty()}
})();
// End V24 ----------------------------------------------------------------------
</script>

<script id="v27-navigation-hard-fix">
(function(){
  const originalNavigate = window.navigate;
  window.navigate = navigate = function(nav){
    state.nav=nav;
    const ws=document.querySelector('.workspace');
    const isModule=nav!=='chat';
    ws?.classList.toggle('module-mode',isModule);
    ws?.classList.toggle('detail-open',!isModule && !!state.detailOpen);
    if(nav==='settings'&&!['account','general','notifications','privacy','member','sync','about'].includes(state.settings))state.settings='account';
    if(nav==='moments'){const d=document.querySelector('[data-nav="moments"] .dot');if(d)d.style.display='none'}
    if(isModule){
      state.detailOpen=false;
      document.querySelector('#detailPanel')?.classList.remove('is-open');
      const lp=document.querySelector('#listPanel'); if(lp) lp.style.display='none';
      const dp=document.querySelector('#detailPanel'); if(dp) dp.style.display='none';
    }else{
      const lp=document.querySelector('#listPanel'); if(lp) lp.style.display='flex';
      const dp=document.querySelector('#detailPanel'); if(dp) dp.style.display='';
    }
    $$('.rail-item').forEach(x=>x.classList.toggle('active',x.dataset.nav===nav));
    if(nav==='chat'){renderList();renderChat()}else{renderModule(nav)}
    saveState();
    try{applyDesktopPrefs?.()}catch(e){}
    requestAnimationFrame(()=>{
      if(isModule){
        const main=document.querySelector('#mainArea');
        const mod=main?.querySelector('.module');
        if(main){main.style.width='100%';main.style.maxWidth='none';}
        if(mod){mod.style.width='100%';mod.style.maxWidth='none';}
      }
    });
  };
  // Re-apply the saved page through the fixed navigation path on startup.
  requestAnimationFrame(()=>window.navigate(state.nav||'chat'));
})();
</script>
